<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | BhoomiSeva</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page"><div class="login-box">
<a href="/" class="back">← Back to BhoomiSeva</a><div class="login-logo">₹</div>
<h1>Create your account</h1><p>Use your own account to access BhoomiSeva.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<label>Full name</label><input name="name" required>
<label>Username</label><input name="username" required>
<label>Role</label><select name="role"><option value="farmer">Farmer</option><option value="surveyor">Surveyor</option></select>
<label>Password</label><input name="password" type="password" minlength="8" required>
<button type="submit">Create account →</button>
</form><p>Already registered? <a href="/login">Login</a></p>
</div></body></html>
